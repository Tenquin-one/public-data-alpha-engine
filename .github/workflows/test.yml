name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -v
      - run: PYTHONPATH=src python3 -m public_data_alpha_engine.cli --db /tmp/alpha-engine-check.sqlite bootstrap
      - run: PYTHONPATH=src python3 -m public_data_alpha_engine.cli --db /tmp/alpha-engine-check.sqlite check
