name: Collect Seoul realtime seed

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Keep Seoul runs ordered without replacing a pending Airport run. The data
  # branch push helper rebases and retries if both collectors finish together.
  group: public-data-seoul-realtime
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out engine
        uses: actions/checkout@v7
        with:
          path: app

      - name: Check out time-axis asset branch
        uses: actions/checkout@v7
        with:
          ref: data
          path: asset
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Collect and make a reproducible run bundle
        id: collector
        shell: bash
        env:
          SEOUL_OPEN_DATA_KEY: ${{ secrets.SEOUL_OPEN_DATA_KEY }}
        run: |
          set +e
          if [ -z "$SEOUL_OPEN_DATA_KEY" ]; then
            export SEOUL_OPEN_DATA_KEY=sample
            echo "mode=SAMPLE" >> "$GITHUB_OUTPUT"
          else
            echo "mode=SEED_COHORT" >> "$GITHUB_OUTPUT"
          fi
          PYTHONPATH=app/src python3 -m public_data_alpha_engine.cli collect-cloud --output asset
          collector_exit=$?
          echo "exit_code=$collector_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit immutable bundles and latest-hash state
        working-directory: asset
        shell: bash
        run: |
          git config user.name "public-data-alpha-bot"
          git config user.email "public-data-alpha-bot@users.noreply.github.com"
          git add bundles runs state
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "collect: Seoul realtime $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            bash ../app/scripts/push_data_branch.sh data
          fi

      - name: Report configuration
        shell: bash
        run: |
          echo "### Seoul collector" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${{ steps.collector.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Durable target: data branch bundles/runs/state" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          state = json.loads(Path("asset/state/latest_hashes.json").read_text(encoding="utf-8"))
          health = state.get("last_health", {})
          schedule = health.get("schedule", {})
          print(f"- Collection status: {state.get('last_status', 'UNKNOWN')}")
          print(f"- Schedule health: {schedule.get('status', 'UNKNOWN')}")
          print(f"- Missed intervals observed at this run: {schedule.get('missed_intervals', 0)}")
          PY
          if [ "${{ steps.collector.outputs.mode }}" = "SAMPLE" ]; then
            echo "- Action required: add repository secret SEOUL_OPEN_DATA_KEY to collect all 8 areas." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail after preserving health record
        if: steps.collector.outputs.exit_code != '0'
        run: exit 1
